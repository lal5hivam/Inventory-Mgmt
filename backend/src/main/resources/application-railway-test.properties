# Railway Database Test Configuration
# Use this to test Railway MySQL connection locally before deploying

spring.application.name=InventoryMgtSystem
server.port=5050

# CORS Configuration - Allow localhost for testing
cors.allowed.origins=http://localhost:3000

# Railway MySQL CONNECTION
# Replace these with your actual Railway database credentials:
spring.datasource.url=jdbc:mysql://<MYSQLHOST>:<MYSQLPORT>/<MYSQLDATABASE>?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=<MYSQLUSER>
spring.datasource.password=<MYSQLPASSWORD>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration - CREATE TABLES ON FIRST RUN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration - Use a test secret
jwt.secret=test-railway-secret-key-min-256-bits-long
jwt.expiration.ms=86400000

# Logging
logging.level.root=INFO
logging.level.com.phegondev.InventoryMgtSystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
