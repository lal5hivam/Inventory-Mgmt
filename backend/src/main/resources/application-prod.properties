# Production Environment Configuration
# ALL VALUES MUST BE SET VIA ENVIRONMENT VARIABLES
# DO NOT COMMIT SECRETS TO VERSION CONTROL

spring.application.name=InventoryMgtSystem
server.port=${SERVER_PORT:8080}

# CORS Configuration - CRITICAL: Set to your production frontend URL
# Example: https://yourdomain.com,https://www.yourdomain.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# MYSQL CONNECTION - Production
# REQUIRED: Must be set via environment variables
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration - REQUIRED: Must be strong random value
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.root=INFO
logging.level.com.phegondev.InventoryMgtSystem=INFO
